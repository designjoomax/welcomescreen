<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nama Halaman | Joomax</title>
<link rel="icon" href="https://designjoomax.github.io/welcomescreen/assets/icon-red.png">

<!-- 1) WELCOME SCREEN: taruh paling atas di <head> -->
<script src="https://designjoomax.github.io/welcomescreen/welcome.js"></script>

<style>
  body{margin:0;font-family:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  joomax-header:not(:defined){display:block;min-height:72px}
</style>
</head>
<body>

<!-- 2) HEADER -->
<joomax-header sticky></joomax-header>

<!-- 3) ISI WEBSITE: ganti dengan isi halaman kamu -->
<main>
  <h1>Isi halaman di sini</h1>
</main>

<!-- 4) FOOTER -->
<joomax-footer></joomax-footer>

<!-- 5) SCRIPT HEADER & FOOTER: taruh di akhir <body>, urutan jangan dibalik -->
<script src="https://designjoomax.github.io/headerfooter/joomax-layout.config.js"></script>
<script src="https://designjoomax.github.io/headerfooter/joomax-layout.js"></script>
</body>
</html>
